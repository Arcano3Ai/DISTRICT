<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <linearGradient id="districtGradientOfficial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="45%" stop-color="#00D4E6" />
      <stop offset="100%" stop-color="#A4E033" />
    </linearGradient>

    <filter id="districtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Base Ground Wings (Tapered) -->
    <path d="M 25 410 L 155 380 L 155 400 L 25 410 Z" fill="url(#districtGradientOfficial)" />
    <path d="M 345 380 L 475 410 L 345 400 Z" fill="url(#districtGradientOfficial)" />

    <!-- Pillar 1 (Leftmost thin) -->
    <path d="M 155 400 L 155 130 L 175 145 L 175 400 Z" fill="url(#districtGradientOfficial)" />

    <!-- Pillar 2 (Middle Left) -->
    <path d="M 185 400 L 185 105 L 205 120 L 205 400 Z" fill="url(#districtGradientOfficial)" />

    <!-- Pillar 3 (Middle Right) -->
    <path d="M 215 400 L 215 80 L 235 95 L 235 400 Z" fill="url(#districtGradientOfficial)" />

    <!-- Main Architectural Arch Portal (Pillar 4) -->
    <path d="M 245 400 L 245 35 L 345 95 L 345 400 H 330 L 330 115 L 265 75 L 265 400 Z" fill="url(#districtGradientOfficial)" />
  </g>

  <!-- District Brand Typography -->
  <text x="250" y="460" font-family="'Montserrat', 'Outfit', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">DISTRICT</text>
  <text x="250" y="495" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" fill="#A4E033" letter-spacing="12" text-anchor="middle">ARQUITECTURA</text>
</svg>
